name: Publish company introductions

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply current site payload
        run: |
          rm -rf kingkong corona goertek-display
          unzip -o site-payload.zip -d .
          rm -f site-payload.zip .github/workflows/publish-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "上线五个公司介绍页面"
          git push

      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail-with-body -sS -X POST "${headers[@]}" "${api}/builds" > /tmp/pages-build.json
          cat /tmp/pages-build.json
          build_id=$(jq -r '.id' /tmp/pages-build.json)

          for attempt in $(seq 1 40); do
            curl --fail-with-body -sS "${headers[@]}" "${api}/builds/${build_id}" > /tmp/pages-status.json
            status=$(jq -r '.status' /tmp/pages-status.json)
            echo "Pages build ${build_id}: ${status}"
            if [ "${status}" = "built" ]; then
              exit 0
            fi
            if [ "${status}" = "errored" ]; then
              jq -r '.error.message // .' /tmp/pages-status.json
              exit 1
            fi
            sleep 10
          done

          echo "Timed out waiting for GitHub Pages"
          exit 1
